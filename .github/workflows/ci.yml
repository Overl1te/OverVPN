name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/overl1te/overvpn-api
  WEB_IMAGE: ghcr.io/overl1te/overvpn-web

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, overvpn]
    timeout-minutes: 30
    env:
      NODE_ENV: test
      WORKERS_ENABLED: 'false'
      DATABASE_URL: postgresql://overvpn:ci@127.0.0.1:5432/overvpn?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:5173
      SUB_PUBLIC_BASE_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci-jwt-access-secret-abcdefghijklmnopqrstuvwxyz0123456789
      SECRETS_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SING_BOX_CLASH_API_SECRET: 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
      BOOTSTRAP_ADMIN_USER: owner
      BOOTSTRAP_ADMIN_PASSWORD: bootstrap-password-16chars
      BACKUP_DIR: /tmp/overvpn-backups
      BACKUP_RETENTION_DAYS: '30'
      BACKUP_ENCRYPT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    needs: verify
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: [self-hosted, linux, x64, overvpn]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker access
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker socket is not accessible for $(whoami)."
            echo "Fix on the runner host:"
            echo "  sudo usermod -aG docker $(whoami)"
            echo "  sudo systemctl restart 'actions.runner.*.service'"
            echo "Then re-login / restart the runner service so the new group applies."
            exit 1
          fi
          docker version
          docker buildx version

      - name: Clean stale Docker resources
        run: |
          set +e
          docker buildx ls --format '{{.Name}}' | while read -r builder; do
            [[ -z "$builder" || "$builder" == "default" || "$builder" == "overvpn-ci" ]] && continue
            echo "Removing stale builder: ${builder}"
            docker buildx rm "$builder" 2>/dev/null || true
          done
          docker buildx prune -af 2>/dev/null || true
          df -h /

      - name: Ensure buildx cache dirs
        run: |
          CACHE_ROOT="${HOME}/.cache/overvpn-buildx"
          mkdir -p "${CACHE_ROOT}/api" "${CACHE_ROOT}/web"
          echo "BUILDX_CACHE_ROOT=${CACHE_ROOT}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: overvpn-ci
          driver: docker-container
          cleanup: true
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage=5GB

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API (+ sing-box)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_ROOT }}/api
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_ROOT }}/api,mode=min

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_ROOT }}/web
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_ROOT }}/web,mode=min

      - name: Package deploy bundle
        run: bash scripts/package-deploy-bundle.sh dist/overvpn-deploy.tar.gz

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: overvpn-deploy
          path: dist/overvpn-deploy.tar.gz
          if-no-files-found: error

      - name: Clean up Docker build resources
        if: always()
        run: |
          set +e
          docker buildx prune -af 2>/dev/null || true
          docker buildx ls --format '{{.Name}}' | while read -r builder; do
            [[ -z "$builder" || "$builder" == "default" || "$builder" == "overvpn-ci" ]] && continue
            echo "Removing leftover builder: ${builder}"
            docker buildx rm "$builder" 2>/dev/null || true
          done
          echo "Disk after cleanup:"
          df -h /
          docker system df

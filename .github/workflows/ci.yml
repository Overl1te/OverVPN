name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      WORKERS_ENABLED: 'false'
      DATABASE_URL: postgresql://overvpn:ci@127.0.0.1:5432/overvpn?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:5173
      SUB_PUBLIC_BASE_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci-jwt-access-secret-abcdefghijklmnopqrstuvwxyz0123456789
      SECRETS_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SING_BOX_CLASH_API_SECRET: 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
      BOOTSTRAP_ADMIN_USER: owner
      BOOTSTRAP_ADMIN_PASSWORD: bootstrap-password-16chars
      BACKUP_DIR: /tmp/overvpn-backups
      BACKUP_RETENTION_DAYS: '30'
      BACKUP_ENCRYPT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

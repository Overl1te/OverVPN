name: overvpn

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  JWT_ISSUER: ${JWT_ISSUER:-overvpn}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-overvpn-admin}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?Set SECRETS_MASTER_KEY in .env}
  TOTP_ISSUER: ${TOTP_ISSUER:-OverVPN}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-overvpn_refresh}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-strict}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/admin/auth}
  LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-5}
  LOGIN_THROTTLE_TTL_MS: ${LOGIN_THROTTLE_TTL_MS:-60000}
  SUB_PUBLIC_BASE_URL: ${SUB_PUBLIC_BASE_URL:?Set SUB_PUBLIC_BASE_URL in .env}
  VPN_PUBLIC_HOST: ${VPN_PUBLIC_HOST:-}
  SUB_PROFILE_UPDATE_INTERVAL_HOURS: ${SUB_PROFILE_UPDATE_INTERVAL_HOURS:-6}
  SUB_RATE_LIMIT_IP_LIMIT: ${SUB_RATE_LIMIT_IP_LIMIT:-60}
  SUB_RATE_LIMIT_TOKEN_LIMIT: ${SUB_RATE_LIMIT_TOKEN_LIMIT:-120}
  SUB_RATE_LIMIT_WINDOW_SECONDS: ${SUB_RATE_LIMIT_WINDOW_SECONDS:-60}
  SING_BOX_BINARY_PATH: /usr/local/bin/sing-box
  SING_BOX_CONFIG_PATH: /var/lib/sing-box/config.json
  SING_BOX_LAST_KNOWN_GOOD_PATH: /var/lib/sing-box/config.last-known-good.json
  SING_BOX_RELOAD_REQUEST_PATH: /var/lib/overvpn/reload/request
  SING_BOX_RELOAD_ACK_PATH: /var/lib/overvpn/reload/ack
  SING_BOX_CLASH_API_URL: http://core:9090
  SING_BOX_CLASH_API_LISTEN: 0.0.0.0:9090
  SING_BOX_CLASH_API_SECRET: ${SING_BOX_CLASH_API_SECRET:?Set SING_BOX_CLASH_API_SECRET in .env}
  SING_BOX_V2RAY_API_LISTEN: 0.0.0.0:8080
  SING_BOX_V2RAY_API_ADDRESS: core:8080
  SING_BOX_PROCESS_TIMEOUT_MS: ${SING_BOX_PROCESS_TIMEOUT_MS:-15000}
  SING_BOX_RELOAD_TIMEOUT_MS: ${SING_BOX_RELOAD_TIMEOUT_MS:-20000}
  SING_BOX_HEALTH_TIMEOUT_MS: ${SING_BOX_HEALTH_TIMEOUT_MS:-5000}
  SING_BOX_UDP_PORT: ${SING_BOX_UDP_PORT:-443}
  SING_BOX_TCP_PORT: ${SING_BOX_TCP_PORT:-4443}
  SING_BOX_TROJAN_PORT: ${SING_BOX_TROJAN_PORT:-8444}
  SING_BOX_SS_PORT: ${SING_BOX_SS_PORT:-8445}
  SING_BOX_ACME_HTTP_PORT: ${SING_BOX_ACME_HTTP_PORT:-80}
  SING_BOX_ACME_TLS_PORT: ${SING_BOX_ACME_TLS_PORT:-443}
  VPN_TLS_CERTIFICATE_PATH: ${VPN_TLS_CERTIFICATE_PATH:-}
  VPN_TLS_KEY_PATH: ${VPN_TLS_KEY_PATH:-}
  XRAY_BINARY_PATH: /usr/local/bin/xray
  XRAY_CONFIG_PATH: /var/lib/xray/config.json
  XRAY_LAST_KNOWN_GOOD_PATH: /var/lib/xray/config.last-known-good.json
  XRAY_RELOAD_REQUEST_PATH: /var/lib/overvpn/xray-reload/request
  XRAY_RELOAD_ACK_PATH: /var/lib/overvpn/xray-reload/ack
  XRAY_LOCATION_ASSET: /usr/local/share/xray
  XRAY_API_LISTEN: 0.0.0.0:10085
  XRAY_STATS_ADDRESS: core-xray:10085
  XRAY_LISTEN_PORT: ${XRAY_LISTEN_PORT:-8443}
  XRAY_GRPC_PORT: ${XRAY_GRPC_PORT:-8446}
  XRAY_TCP_TLS_PORT: ${XRAY_TCP_TLS_PORT:-8447}
  XRAY_PROCESS_TIMEOUT_MS: ${XRAY_PROCESS_TIMEOUT_MS:-15000}
  XRAY_RELOAD_TIMEOUT_MS: ${XRAY_RELOAD_TIMEOUT_MS:-20000}
  XRAY_HEALTH_TIMEOUT_MS: ${XRAY_HEALTH_TIMEOUT_MS:-5000}
  MTPROXY_ENABLED: ${MTPROXY_ENABLED:-true}
  MTPROXY_CONFIG_PATH: /var/lib/mtproxy/config.json
  MTPROXY_LAST_KNOWN_GOOD_PATH: /var/lib/mtproxy/config.last-known-good.json
  MTPROXY_RELOAD_REQUEST_PATH: /var/lib/overvpn/mtproxy-reload/request
  MTPROXY_RELOAD_ACK_PATH: /var/lib/overvpn/mtproxy-reload/ack
  MTPROXY_PID_PATH: /var/lib/overvpn/mtproxy-reload/mtproxy.pid
  MTPROXY_HEARTBEAT_PATH: /var/lib/overvpn/mtproxy-reload/heartbeat
  MTPROXY_HEARTBEAT_MAX_AGE_SECONDS: ${MTPROXY_HEARTBEAT_MAX_AGE_SECONDS:-15}
  MTPROXY_RUNTIME_STATS_PATH: /var/lib/overvpn/mtproxy-reload/runtime-stats.json
  MTPROXY_RUNTIME_STATS_MAX_AGE_SECONDS: ${MTPROXY_RUNTIME_STATS_MAX_AGE_SECONDS:-30}
  MTPROXY_API_PORT_BASE: ${MTPROXY_API_PORT_BASE:-19000}
  MTPROXY_PORT_MIN: ${MTPROXY_PORT_MIN:-10001}
  MTPROXY_PORT_MAX: ${MTPROXY_PORT_MAX:-10016}
  MTPROXY_PROCESS_TIMEOUT_MS: ${MTPROXY_PROCESS_TIMEOUT_MS:-15000}
  MTPROXY_RELOAD_TIMEOUT_MS: ${MTPROXY_RELOAD_TIMEOUT_MS:-20000}
  MTPROXY_HEALTH_TIMEOUT_MS: ${MTPROXY_HEALTH_TIMEOUT_MS:-5000}
  CORE_APPLY_LOCK_TTL_MS: ${CORE_APPLY_LOCK_TTL_MS:-60000}
  WORKERS_ENABLED: ${WORKERS_ENABLED:-true}
  WORKER_LOCK_TTL_MS: ${WORKER_LOCK_TTL_MS:-60000}
  TRAFFIC_COLLECTION_INTERVAL_MS: ${TRAFFIC_COLLECTION_INTERVAL_MS:-15000}
  TRAFFIC_AGGREGATION_INTERVAL_MS: ${TRAFFIC_AGGREGATION_INTERVAL_MS:-60000}
  TRAFFIC_AGGREGATION_BATCH_SIZE: ${TRAFFIC_AGGREGATION_BATCH_SIZE:-1000}
  TRAFFIC_LEDGER_RETENTION_DAYS: ${TRAFFIC_LEDGER_RETENTION_DAYS:-90}
  ONLINE_COLLECTION_INTERVAL_MS: ${ONLINE_COLLECTION_INTERVAL_MS:-15000}
  ONLINE_SWEEP_INTERVAL_MS: ${ONLINE_SWEEP_INTERVAL_MS:-30000}
  ONLINE_SESSION_TIMEOUT_MS: ${ONLINE_SESSION_TIMEOUT_MS:-90000}
  ONLINE_SESSION_RETENTION_DAYS: ${ONLINE_SESSION_RETENTION_DAYS:-30}
  ENFORCEMENT_INTERVAL_MS: ${ENFORCEMENT_INTERVAL_MS:-30000}
  IDENTITY_LOOKBACK_MS: ${IDENTITY_LOOKBACK_MS:-1800000}
  IDENTITY_LIMIT_HOLD_MS: ${IDENTITY_LIMIT_HOLD_MS:-900000}
  UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
  UPDATE_CHECK_INTERVAL_MS: ${UPDATE_CHECK_INTERVAL_MS:-21600000}
  UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-Overl1te/OverVPN}
  UPDATE_CHECK_REF: ${UPDATE_CHECK_REF:-master}
  UPDATE_CHECK_TIMEOUT_MS: ${UPDATE_CHECK_TIMEOUT_MS:-10000}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-5000}
  BACKUP_DIR: ${BACKUP_DIR:-/var/lib/overvpn/backups}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-true}
  BACKUP_PROCESS_TIMEOUT_MS: ${BACKUP_PROCESS_TIMEOUT_MS:-600000}

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile
  args:
    OVERVPN_GIT_SHA: ${OVERVPN_GIT_SHA:-}

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    <<: *service-security

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-ec', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test:
        ['CMD-SHELL', 'test "$$(redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    <<: *service-security

  core-config-init:
    image: busybox:1.37
    restart: 'no'
    network_mode: none
    environment:
      SING_BOX_CLASH_API_LISTEN: 0.0.0.0:9090
      SING_BOX_CLASH_API_SECRET: ${SING_BOX_CLASH_API_SECRET:?Set SING_BOX_CLASH_API_SECRET in .env}
      SING_BOX_V2RAY_API_LISTEN: 0.0.0.0:8080
    entrypoint: ['/bin/sh', '/seed/bootstrap-config.sh']
    volumes:
      - ./sing-box/bootstrap-config.sh:/seed/bootstrap-config.sh:ro
      - ./sing-box/config.json:/seed/config.json:ro
      - singbox_config:/shared
      - singbox_reload:/reload
      - singbox_state:/state
    <<: *service-security

  core:
    image: ${API_IMAGE:-ghcr.io/overl1te/overvpn-api:latest}
    build: *api-build
    restart: unless-stopped
    entrypoint: ['/usr/bin/dumb-init', '--', '/usr/local/bin/sing-box-entrypoint']
    environment:
      SING_BOX_CONFIG_PATH: /var/lib/sing-box/config.json
      SING_BOX_RELOAD_REQUEST_PATH: /var/lib/overvpn/reload/request
      SING_BOX_RELOAD_ACK_PATH: /var/lib/overvpn/reload/ack
      SING_BOX_PID_PATH: /var/lib/overvpn/reload/sing-box.pid
    depends_on:
      core-config-init:
        condition: service_completed_successfully
    volumes:
      - singbox_config:/var/lib/sing-box:ro
      - singbox_reload:/var/lib/overvpn/reload
      - singbox_state:/var/lib/sing-box-state
      # Separate mount: cannot nest under read-only singbox_config volume
      - ./sing-box/certs:/var/lib/sing-box-certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - '${SING_BOX_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_UDP_PORT:-443}:${SING_BOX_UDP_PORT:-443}/udp'
      - '${SING_BOX_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_TCP_PORT:-4443}:${SING_BOX_TCP_PORT:-4443}/tcp'
      - '${SING_BOX_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_TROJAN_PORT:-8444}:${SING_BOX_TROJAN_PORT:-8444}/tcp'
      - '${SING_BOX_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_SS_PORT:-8445}:${SING_BOX_SS_PORT:-8445}/tcp'
      - '${SING_BOX_ACME_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_ACME_HTTP_PORT:-80}:${SING_BOX_ACME_HTTP_PORT:-80}/tcp'
      - '${SING_BOX_ACME_BIND_ADDRESS:-0.0.0.0}:${SING_BOX_ACME_TLS_PORT:-443}:${SING_BOX_ACME_TLS_PORT:-443}/tcp'
    expose:
      - '9090'
      - '8080'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -r /var/lib/overvpn/reload/sing-box.pid && kill -0 "$$(cat /var/lib/overvpn/reload/sing-box.pid)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - core
    <<: *service-security

  core-xray-config-init:
    image: busybox:1.37
    restart: 'no'
    network_mode: none
    environment:
      XRAY_API_LISTEN: 0.0.0.0:10085
    entrypoint: ['/bin/sh', '/seed/bootstrap-config.sh']
    volumes:
      - ./xray/bootstrap-config.sh:/seed/bootstrap-config.sh:ro
      - ./xray/config.json:/seed/config.json:ro
      - xray_config:/shared
      - xray_reload:/reload
      - xray_state:/state
    <<: *service-security

  core-xray:
    image: ${API_IMAGE:-ghcr.io/overl1te/overvpn-api:latest}
    build: *api-build
    restart: unless-stopped
    # Prefer the bind-mounted deploy script so reload can restart Xray when
    # SIGHUP exits the process (observed with Xray 26.x). Run via sh so the
    # host file does not need the executable bit (common after extract/copy).
    entrypoint: ['/usr/bin/dumb-init', '--', '/bin/sh', '/entrypoint/xray-entrypoint.sh']
    environment:
      XRAY_CONFIG_PATH: /var/lib/xray/config.json
      XRAY_RELOAD_REQUEST_PATH: /var/lib/overvpn/xray-reload/request
      XRAY_RELOAD_ACK_PATH: /var/lib/overvpn/xray-reload/ack
      XRAY_PID_PATH: /var/lib/overvpn/xray-reload/xray.pid
      XRAY_LOCATION_ASSET: /usr/local/share/xray
    depends_on:
      core-xray-config-init:
        condition: service_completed_successfully
    volumes:
      - ./xray/entrypoint.sh:/entrypoint/xray-entrypoint.sh:ro
      - xray_config:/var/lib/xray:ro
      - xray_reload:/var/lib/overvpn/xray-reload
      - xray_state:/var/lib/xray-state
      - ./xray/certs:/var/lib/xray-certs:ro
      # Reuse the same LE cert files when VLESS xHTTP TLS uses FILES mode.
      - ./sing-box/certs:/var/lib/sing-box-certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - '${XRAY_BIND_ADDRESS:-0.0.0.0}:${XRAY_LISTEN_PORT:-8443}:${XRAY_LISTEN_PORT:-8443}/tcp'
      - '${XRAY_BIND_ADDRESS:-0.0.0.0}:${XRAY_GRPC_PORT:-8446}:${XRAY_GRPC_PORT:-8446}/tcp'
      - '${XRAY_BIND_ADDRESS:-0.0.0.0}:${XRAY_TCP_TLS_PORT:-8447}:${XRAY_TCP_TLS_PORT:-8447}/tcp'
    expose:
      - '10085'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -r /var/lib/overvpn/xray-reload/xray.pid && kill -0 "$$(cat /var/lib/overvpn/xray-reload/xray.pid)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - core
    <<: *service-security

  core-mtproxy-config-init:
    profiles: ['mtproxy']
    image: busybox:1.37
    restart: 'no'
    network_mode: none
    entrypoint: ['/bin/sh', '/seed/bootstrap-config.sh']
    volumes:
      - ./mtproxy/bootstrap-config.sh:/seed/bootstrap-config.sh:ro
      - ./mtproxy/config.json:/seed/config.json:ro
      - mtproxy_config:/shared
      - mtproxy_reload:/reload
      - mtproxy_state:/state
      - mtproxy_work:/work
    <<: *service-security

  core-mtproxy:
    profiles: ['mtproxy']
    image: ${MTPROXY_IMAGE:-ghcr.io/overl1te/overvpn-mtproxy:latest}
    build:
      context: ./mtproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MTPROXY_CONFIG_PATH: /var/lib/mtproxy/config.json
      MTPROXY_RELOAD_REQUEST_PATH: /var/lib/overvpn/mtproxy-reload/request
      MTPROXY_RELOAD_ACK_PATH: /var/lib/overvpn/mtproxy-reload/ack
      MTPROXY_PID_PATH: /var/lib/overvpn/mtproxy-reload/mtproxy.pid
      MTPROXY_HEARTBEAT_PATH: /var/lib/overvpn/mtproxy-reload/heartbeat
      MTPROXY_RUNTIME_STATS_PATH: /var/lib/overvpn/mtproxy-reload/runtime-stats.json
      MTPROXY_WORK_DIR: /var/lib/mtproxy-work
      MTPROXY_USE_MIDDLE_PROXY: ${MTPROXY_USE_MIDDLE_PROXY:-true}
      MTPROXY_STATS_POLL_SECONDS: ${MTPROXY_STATS_POLL_SECONDS:-5}
      TELEMT_BIN: /usr/local/bin/telemt
    depends_on:
      core-mtproxy-config-init:
        condition: service_completed_successfully
    volumes:
      - mtproxy_config:/var/lib/mtproxy:ro
      - mtproxy_reload:/var/lib/overvpn/mtproxy-reload
      - mtproxy_state:/var/lib/mtproxy-state
      - mtproxy_work:/var/lib/mtproxy-work
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - '${MTPROXY_BIND_ADDRESS:-0.0.0.0}:${MTPROXY_PORT_MIN:-10001}-${MTPROXY_PORT_MAX:-10016}:${MTPROXY_PORT_MIN:-10001}-${MTPROXY_PORT_MAX:-10016}/tcp'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -r /var/lib/overvpn/mtproxy-reload/mtproxy.pid && kill -0 "$$(cat /var/lib/overvpn/mtproxy-reload/mtproxy.pid)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - core
    <<: *service-security

  migrate:
    image: ${API_IMAGE:-ghcr.io/overl1te/overvpn-api:latest}
    build: *api-build
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command:
      [
        'node',
        'apps/api/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--config',
        'apps/api/prisma.config.ts',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    <<: *service-security

  api:
    image: ${API_IMAGE:-ghcr.io/overl1te/overvpn-api:latest}
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *api-environment
      HOST_PROC: /host/proc
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
      core-xray:
        condition: service_healthy
      core-mtproxy:
        condition: service_healthy
        required: false
    volumes:
      - /proc:/host/proc:ro
      - singbox_config:/var/lib/sing-box
      - singbox_reload:/var/lib/overvpn/reload
      - singbox_state:/var/lib/sing-box-state
      - ./sing-box/certs:/var/lib/sing-box-certs:ro
      - xray_config:/var/lib/xray
      - xray_reload:/var/lib/overvpn/xray-reload
      - xray_state:/var/lib/xray-state
      - ./xray/certs:/var/lib/xray-certs:ro
      - mtproxy_config:/var/lib/mtproxy
      - mtproxy_reload:/var/lib/overvpn/mtproxy-reload
      - mtproxy_state:/var/lib/mtproxy-state
      - backup_data:/var/lib/overvpn/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - '3000'
    networks:
      - backend
      - core
    <<: *service-security

  web:
    image: ${WEB_IMAGE:-ghcr.io/overl1te/overvpn-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80'
    networks:
      - backend
    <<: *service-security

  bootstrap-admin:
    profiles: ['tools']
    image: ${API_IMAGE:-ghcr.io/overl1te/overvpn-api:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['node', 'apps/api/dist/scripts/bootstrap-admin.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    <<: *service-security

volumes:
  postgres_data:
  redis_data:
  singbox_config:
  singbox_reload:
  singbox_state:
  xray_config:
  xray_reload:
  xray_state:
  mtproxy_config:
  mtproxy_reload:
  mtproxy_state:
  mtproxy_work:
  backup_data:

networks:
  backend:
    driver: bridge
  core:
    driver: bridge

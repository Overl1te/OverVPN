<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <title>OverVPN — подписки</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', 'IBM Plex Sans', system-ui, sans-serif;
        color: #e8eefc;
        background: #0b1220;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        color: #9aa8c7;
        line-height: 1.5;
      }
      code {
        color: #cfe3ff;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Subscription endpoint</h1>
      <p>
        Корневой путь пустой намеренно. Рабочий URL:
        <code>/api/sub/&lt;TOKEN&gt;</code>
      </p>
      <p>
        В браузере этот URL показывает статус подписки (срок, трафик, лимиты). VPN-клиенты
        получают профиль; JSON-статус доступен по
        <code>/api/sub/&lt;TOKEN&gt;/info</code>.
      </p>
      <p>Токен выдаёт администратор в панели OverVPN.</p>
    </main>
  </body>
</html>

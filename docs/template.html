<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Документация OverVPN — однонодовая VPN-панель" />
    <title>{{TITLE}} — OverVPN</title>
    <link rel="icon" href="{{BASE}}static/favicon.png" type="image/png" />
    <link rel="stylesheet" href="{{BASE}}assets/css/style.css" />
    <link rel="stylesheet" href="{{BASE}}pagefind/pagefind-ui.css" />
  </head>
  <body class="{{BODY_CLASS}}" data-page="{{PAGE_ID}}">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{BASE}}index.html">
          <img src="{{BASE}}static/logo.png" alt="" width="32" height="32" />
          <span>OverVPN</span>
        </a>
        <nav class="header-nav">
          <a href="{{BASE}}guide/introduction.html">Руководство</a>
          <a href="{{BASE}}reference/cli.html">Справочник</a>
          <a href="{{BASE}}faq.html">FAQ</a>
          <a href="https://github.com/Overl1te/OverVPN" target="_blank" rel="noopener">GitHub</a>
        </nav>
        <div class="header-actions">
          <div id="search"></div>
          <button type="button" class="theme-toggle" aria-label="Переключить тему"></button>
          <button
            type="button"
            class="menu-toggle"
            aria-label="Меню"
            aria-expanded="false"
          ></button>
        </div>
      </div>
    </header>

    <div class="site-shell {{LAYOUT_CLASS}}">
      <aside class="sidebar" id="sidebar">{{SIDEBAR}}</aside>
      <main class="content" data-pagefind-body>{{CONTENT}}</main>
    </div>

    <footer class="site-footer">
      <p>OverVPN — AGPL-3.0-only · Copyright © 2026 Overl1te</p>
    </footer>

    <script>
      window.DOCS_BASE = '{{BASE}}';
    </script>
    <script src="{{BASE}}assets/js/app.js"></script>
    <script src="{{BASE}}pagefind/pagefind-ui.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (typeof PagefindUI !== 'undefined') {
          new PagefindUI({
            element: '#search',
            bundlePath: window.DOCS_BASE + 'pagefind/',
            showSubResults: true,
            resetStyles: false,
          });
        }
      });
    </script>
  </body>
</html>

packages:
  - apps/*
  - packages/*

# Force patched transitive deps (Dependabot can't open PRs on pnpm 11 yet).
overrides:
  # Prisma/@prisma/dev pins vulnerable 1.19.x; force patched 2.x (generate OK).
  '@hono/node-server': 2.0.12
  hono: '>=4.12.34'
  valibot: '>=1.4.2'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.26'
  fast-uri: '>=3.1.5'
  'js-yaml@3': 3.15.1
  'js-yaml@4': 4.3.1
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.9

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
